<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Political Ideology Quiz</title>
  <meta name="robots" content="noindex, follow">
  <meta name="theme-color" content="#4f46e5">
  <link rel="icon" href="assets/img/icon.svg" type="image/svg+xml">
  <link rel="manifest" href="site.webmanifest">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="quiz">
  <header class="site-header">
    <a class="brand" href="index.html" data-link="index.html"><img src="assets/img/icon.svg" alt="" width="28" height="28"><span data-i18n="siteName">Political Ideology Quiz</span></a>
    <a class="lang-switch" href="#" data-lang-switch>हिन्दी</a>
  </header>

  <main class="container">
    <div class="ad" data-ad="top"></div>

    <div class="progress">
      <div class="progress__row">
        <span id="progress-text">Question 1 of 12</span>
        <a class="progress__back" id="back-link" href="#" hidden aria-label="Previous question">←</a>
      </div>
      <div class="progress__bar" id="progress-bar" role="progressbar" aria-valuemin="1" aria-valuemax="12" aria-valuenow="1">
        <div class="progress__fill" id="progress-fill"></div>
      </div>
    </div>

    <section class="card question">
      <p class="question__label" id="question-domain"></p>
      <h1 class="question__text" id="question-text"></h1>
      <div class="options" id="options"></div>
      <noscript><p>Please enable JavaScript to take the quiz.</p></noscript>
    </section>

    <section class="content">
      <h2 data-i18n="whyHeading">Why this matters</h2>
      <p id="why-text"></p>
    </section>

    <div class="ad" data-ad="middle"></div>
  </main>

  <footer class="site-footer">
    <nav>
      <a href="about.html" data-link="about.html" data-i18n="footerAbout">About</a>
      <a href="privacy.html" data-link="privacy.html" data-i18n="footerPrivacy">Privacy Policy</a>
      <a href="contact.html" data-link="contact.html" data-i18n="footerContact">Contact</a>
    </nav>
    <p>© <span data-i18n="siteName">Political Ideology Quiz</span></p>
  </footer>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/strings.js"></script>
  <script src="assets/js/questions.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
