<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Gradients -->
    <linearGradient id="t1-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="t1-north-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="t1-north-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="t1-east-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="t1-east-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="t1-south-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="t1-south-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="t1-west-l" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="t1-west-r" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="t1-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4f46e5" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#t1-bg)"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Subtle Coordinate Reference Rings -->
  <g transform="translate(256, 256)" filter="url(#t1-shadow)">
    <!-- Outer Precision Ring -->
    <circle r="180" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <circle r="180" fill="none" stroke="#4f46e5" stroke-width="3" stroke-dasharray="4 28" opacity="0.6"/>
    
    <!-- Secondary Orbital Ring -->
    <circle r="140" fill="none" stroke="#f1f5f9" stroke-width="1.5"/>

    <!-- Subtle Crosshair Axes -->
    <line x1="-195" y1="0" x2="195" y2="0" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>
    <line x1="0" y1="-195" x2="0" y2="195" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="6 6"/>

    <!-- 4 Cardinal Degree Ticks -->
    <circle cx="0" cy="-180" r="4" fill="#4f46e5"/>
    <circle cx="180" cy="0" r="4" fill="#f59e0b"/>
    <circle cx="0" cy="180" r="4" fill="#64748b"/>
    <circle cx="-180" cy="0" r="4" fill="#94a3b8"/>

    <!-- Compass Star Facets -->
    <!-- North Point (Indigo) -->
    <polygon points="0,0 0,-155 -32,-32" fill="url(#t1-north-l)"/>
    <polygon points="0,0 0,-155 32,-32" fill="url(#t1-north-r)"/>

    <!-- South Point (Slate) -->
    <polygon points="0,0 0,155 -32,32" fill="url(#t1-south-l)"/>
    <polygon points="0,0 0,155 32,32" fill="url(#t1-south-r)"/>

    <!-- East Point (Amber Gold) -->
    <polygon points="0,0 155,0 32,-32" fill="url(#t1-east-l)"/>
    <polygon points="0,0 155,0 32,32" fill="url(#t1-east-r)"/>

    <!-- West Point (Soft Slate) -->
    <polygon points="0,0 -155,0 -32,-32" fill="url(#t1-west-l)"/>
    <polygon points="0,0 -155,0 -32,32" fill="url(#t1-west-r)"/>

    <!-- Center Navigational Pivot -->
    <circle r="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle r="14" fill="#4f46e5"/>
    <circle r="6" fill="#fbbf24"/>
  </g>
</svg>
