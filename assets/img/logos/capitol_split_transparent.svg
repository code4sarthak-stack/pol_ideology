<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Half: Royal Blue (Left / Progressive) -->
    <linearGradient id="t-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Half: Vibrant Orange (Right / Conservative) -->
    <linearGradient id="t-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <clipPath id="t-clip-l">
      <rect x="0" y="0" width="254.8" height="512"/>
    </clipPath>
    <clipPath id="t-clip-r">
      <rect x="257.2" y="0" width="254.8" height="512"/>
    </clipPath>
  </defs>

  <!-- CAPITOL BUILDING (TRANSPARENT BACKGROUND) -->
  <g>
    <!-- LEFT HALF (BLUE) -->
    <g clip-path="url(#t-clip-l)" fill="url(#t-blue)">
      <!-- Flag & Pole -->
      <line x1="256" y1="95" x2="256" y2="145" stroke="#1d4ed8" stroke-width="5" stroke-linecap="round"/>
      <path d="M 256, 98 C 244, 94 235, 102 224, 99 L 224, 116 C 235, 119 244, 111 256, 115 Z"/>

      <!-- Cupola -->
      <rect x="246" y="142" width="20" height="18" rx="3"/>
      <ellipse cx="256" cy="142" rx="14" ry="5"/>

      <!-- Dome Arch -->
      <path d="M 168, 240 C 168, 162 208, 150 256, 150 C 304, 150 344, 162 344, 240 Z"/>

      <!-- Rotunda Drum -->
      <rect x="156" y="240" width="200" height="30" rx="4"/>

      <!-- Entablature Beam -->
      <polygon points="134,280 378,280 370,294 142,294"/>

      <!-- 6 Columns -->
      <rect x="154" y="298" width="20" height="78" rx="4"/>
      <rect x="188" y="298" width="20" height="78" rx="4"/>
      <rect x="222" y="298" width="20" height="78" rx="4"/>
      <rect x="270" y="298" width="20" height="78" rx="4"/>
      <rect x="304" y="298" width="20" height="78" rx="4"/>
      <rect x="338" y="298" width="20" height="78" rx="4"/>

      <!-- Plinth -->
      <rect x="124" y="380" width="264" height="18" rx="3"/>

      <!-- 3 Steps -->
      <polygon points="110,402 402,402 392,418 120,418"/>
      <polygon points="96,422 416,422 404,440 108,440"/>
      <polygon points="80,444 432,444 418,464 94,464"/>
    </g>

    <!-- Drum Windows Cutouts -->
    <g fill="#ffffff" opacity="0.95">
      <rect x="172" y="246" width="9" height="18" rx="4.5"/>
      <rect x="194" y="246" width="9" height="18" rx="4.5"/>
      <rect x="216" y="246" width="9" height="18" rx="4.5"/>
      <rect x="238" y="246" width="9" height="18" rx="4.5"/>
    </g>

    <!-- RIGHT HALF (ORANGE) -->
    <g clip-path="url(#t-clip-r)" fill="url(#t-orange)">
      <!-- Flag & Pole -->
      <line x1="256" y1="95" x2="256" y2="145" stroke="#ea580c" stroke-width="5" stroke-linecap="round"/>
      <path d="M 256, 98 C 268, 94 277, 102 288, 99 L 288, 116 C 277, 119 268, 111 256, 115 Z"/>

      <!-- Cupola -->
      <rect x="246" y="142" width="20" height="18" rx="3"/>
      <ellipse cx="256" cy="142" rx="14" ry="5"/>

      <!-- Dome Arch -->
      <path d="M 168, 240 C 168, 162 208, 150 256, 150 C 304, 150 344, 162 344, 240 Z"/>

      <!-- Rotunda Drum -->
      <rect x="156" y="240" width="200" height="30" rx="4"/>

      <!-- Entablature Beam -->
      <polygon points="134,280 378,280 370,294 142,294"/>

      <!-- 6 Columns -->
      <rect x="154" y="298" width="20" height="78" rx="4"/>
      <rect x="188" y="298" width="20" height="78" rx="4"/>
      <rect x="222" y="298" width="20" height="78" rx="4"/>
      <rect x="270" y="298" width="20" height="78" rx="4"/>
      <rect x="304" y="298" width="20" height="78" rx="4"/>
      <rect x="338" y="298" width="20" height="78" rx="4"/>

      <!-- Plinth -->
      <rect x="124" y="380" width="264" height="18" rx="3"/>

      <!-- 3 Steps -->
      <polygon points="110,402 402,402 392,418 120,418"/>
      <polygon points="96,422 416,422 404,440 108,440"/>
      <polygon points="80,444 432,444 418,464 94,464"/>
    </g>

    <!-- Drum Windows Cutouts -->
    <g fill="#ffffff" opacity="0.95">
      <rect x="265" y="246" width="9" height="18" rx="4.5"/>
      <rect x="287" y="246" width="9" height="18" rx="4.5"/>
      <rect x="309" y="246" width="9" height="18" rx="4.5"/>
      <rect x="331" y="246" width="9" height="18" rx="4.5"/>
    </g>

    <!-- Center Line Division -->
    <line x1="256" y1="95" x2="256" y2="464" stroke="#ffffff" stroke-width="2.5"/>
  </g>
</svg>
