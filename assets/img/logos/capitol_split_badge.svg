<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Dark/Solid Badge Background -->
    <linearGradient id="badge-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Vibrant Left Blue -->
    <linearGradient id="badge-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>

    <!-- Vibrant Right Orange -->
    <linearGradient id="badge-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <filter id="badge-shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35"/>
    </filter>

    <clipPath id="b-clip-l">
      <rect x="0" y="0" width="255" height="512"/>
    </clipPath>
    <clipPath id="b-clip-r">
      <rect x="257" y="0" width="255" height="512"/>
    </clipPath>
  </defs>

  <!-- Circular Outer Badge -->
  <rect width="512" height="512" rx="120" fill="url(#badge-bg)"/>
  <rect width="512" height="512" rx="120" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Subtle Center Axis Crosshair Background -->
  <line x1="256" y1="80" x2="256" y2="440" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>
  <line x1="80" y1="270" x2="432" y2="270" stroke="rgba(255,255,255,0.06)" stroke-width="1.5"/>

  <!-- BUILDING (IN TWO HALVES) -->
  <g filter="url(#badge-shadow)">
    <!-- LEFT HALF (BLUE) -->
    <g clip-path="url(#b-clip-l)" fill="url(#badge-blue)">
      <!-- Flag -->
      <line x1="256" y1="120" x2="256" y2="160" stroke="#60a5fa" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 256, 122 C 246, 119 238, 126 228, 123 L 228, 137 C 238, 140 246, 133 256, 136 Z"/>

      <!-- Cupola -->
      <rect x="248" y="158" width="16" height="15" rx="2"/>
      <ellipse cx="256" cy="158" rx="12" ry="4"/>

      <!-- Dome -->
      <path d="M 180, 240 C 180, 175 214, 164 256, 164 C 298, 164 332, 175 332, 240 Z"/>

      <!-- Drum Band -->
      <rect x="170" y="240" width="172" height="26" rx="3"/>

      <!-- Entablature -->
      <polygon points="150,274 362,274 354,286 158,286"/>

      <!-- 6 Columns -->
      <rect x="170" y="290" width="18" height="68" rx="4"/>
      <rect x="200" y="290" width="18" height="68" rx="4"/>
      <rect x="230" y="290" width="18" height="68" rx="4"/>
      <rect x="264" y="290" width="18" height="68" rx="4"/>
      <rect x="294" y="290" width="18" height="68" rx="4"/>
      <rect x="324" y="290" width="18" height="68" rx="4"/>

      <!-- Plinth -->
      <rect x="144" y="362" width="224" height="15" rx="3"/>

      <!-- 3 Steps -->
      <polygon points="132,381 380,381 372,394 140,394"/>
      <polygon points="120,398 392,398 382,413 130,413"/>
      <polygon points="108,417 404,417 394,434 118,434"/>
    </g>

    <!-- RIGHT HALF (ORANGE) -->
    <g clip-path="url(#b-clip-r)" fill="url(#badge-orange)">
      <!-- Flag -->
      <line x1="256" y1="120" x2="256" y2="160" stroke="#fb923c" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 256, 122 C 266, 119 274, 126 284, 123 L 284, 137 C 274, 140 266, 133 256, 136 Z"/>

      <!-- Cupola -->
      <rect x="248" y="158" width="16" height="15" rx="2"/>
      <ellipse cx="256" cy="158" rx="12" ry="4"/>

      <!-- Dome -->
      <path d="M 180, 240 C 180, 175 214, 164 256, 164 C 298, 164 332, 175 332, 240 Z"/>

      <!-- Drum Band -->
      <rect x="170" y="240" width="172" height="26" rx="3"/>

      <!-- Entablature -->
      <polygon points="150,274 362,274 354,286 158,286"/>

      <!-- 6 Columns -->
      <rect x="170" y="290" width="18" height="68" rx="4"/>
      <rect x="200" y="290" width="18" height="68" rx="4"/>
      <rect x="230" y="290" width="18" height="68" rx="4"/>
      <rect x="264" y="290" width="18" height="68" rx="4"/>
      <rect x="294" y="290" width="18" height="68" rx="4"/>
      <rect x="324" y="290" width="18" height="68" rx="4"/>

      <!-- Plinth -->
      <rect x="144" y="362" width="224" height="15" rx="3"/>

      <!-- 3 Steps -->
      <polygon points="132,381 380,381 372,394 140,394"/>
      <polygon points="120,398 392,398 382,413 130,413"/>
      <polygon points="108,417 404,417 394,434 118,434"/>
    </g>

    <!-- Center Line Division -->
    <line x1="256" y1="120" x2="256" y2="434" stroke="#0f172a" stroke-width="2.5"/>
  </g>
</svg>
