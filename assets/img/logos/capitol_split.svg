<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Left Half: Royal Blue (Left / Progressive) -->
    <linearGradient id="cap-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>

    <!-- Right Half: Vibrant Orange (Right / Conservative) -->
    <linearGradient id="cap-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>

    <!-- Drop Shadow for building silhouette -->
    <filter id="cap-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>

    <!-- Center Clip Masks -->
    <clipPath id="mask-left">
      <rect x="0" y="0" width="254.8" height="512"/>
    </clipPath>
    <clipPath id="mask-right">
      <rect x="257.2" y="0" width="254.8" height="512"/>
    </clipPath>
  </defs>

  <!-- Clean Canvas Background -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Subtle Ambient Halo -->
  <circle cx="256" cy="275" r="180" fill="#f8fafc"/>

  <!-- CAPITOL BUILDING IN TWO HORIZONTAL HALVES (LEFT BLUE, RIGHT ORANGE) -->
  <g filter="url(#cap-shadow)">
    <!-- ================= LEFT HALF (BLUE) ================= -->
    <g clip-path="url(#mask-left)" fill="url(#cap-blue)">
      <!-- Flag & Pole -->
      <line x1="256" y1="110" x2="256" y2="152" stroke="#1d4ed8" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 256, 112 C 246, 109 238, 116 228, 113 L 228, 128 C 238, 131 246, 124 256, 127 Z"/>

      <!-- Cupola / Lantern -->
      <rect x="248" y="148" width="16" height="16" rx="2"/>
      <ellipse cx="256" cy="148" rx="12" ry="4"/>

      <!-- Dome Arch -->
      <path d="M 176, 238 C 176, 168 212, 156 256, 156 C 300, 156 336, 168 336, 238 Z"/>

      <!-- Rotunda Drum -->
      <rect x="166" y="238" width="180" height="28" rx="3"/>

      <!-- Entablature / Pediment Roof Beam -->
      <polygon points="144,276 368,276 360,288 152,288"/>

      <!-- 6 Classical Pillars (3 Left) -->
      <rect x="164" y="292" width="18" height="74" rx="4"/>
      <rect x="196" y="292" width="18" height="74" rx="4"/>
      <rect x="228" y="292" width="18" height="74" rx="4"/>
      <rect x="266" y="292" width="18" height="74" rx="4"/>
      <rect x="298" y="292" width="18" height="74" rx="4"/>
      <rect x="330" y="292" width="18" height="74" rx="4"/>

      <!-- Base Plinth -->
      <rect x="136" y="370" width="240" height="16" rx="3"/>

      <!-- 3 Tiered Steps -->
      <polygon points="122,390 390,390 382,404 130,404"/>
      <polygon points="110,408 402,408 392,424 120,424"/>
      <polygon points="96,428 416,428 404,446 108,446"/>
    </g>

    <!-- Drum Windows (Left Half Cutouts) -->
    <g fill="#ffffff" opacity="0.95">
      <rect x="180" y="244" width="8" height="16" rx="4"/>
      <rect x="200" y="244" width="8" height="16" rx="4"/>
      <rect x="220" y="244" width="8" height="16" rx="4"/>
      <rect x="240" y="244" width="8" height="16" rx="4"/>
    </g>

    <!-- ================= RIGHT HALF (ORANGE) ================= -->
    <g clip-path="url(#mask-right)" fill="url(#cap-orange)">
      <!-- Flag & Pole -->
      <line x1="256" y1="110" x2="256" y2="152" stroke="#ea580c" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M 256, 112 C 266, 109 274, 116 284, 113 L 284, 128 C 274, 131 266, 124 256, 127 Z"/>

      <!-- Cupola / Lantern -->
      <rect x="248" y="148" width="16" height="16" rx="2"/>
      <ellipse cx="256" cy="148" rx="12" ry="4"/>

      <!-- Dome Arch -->
      <path d="M 176, 238 C 176, 168 212, 156 256, 156 C 300, 156 336, 168 336, 238 Z"/>

      <!-- Rotunda Drum -->
      <rect x="166" y="238" width="180" height="28" rx="3"/>

      <!-- Entablature / Pediment Roof Beam -->
      <polygon points="144,276 368,276 360,288 152,288"/>

      <!-- 6 Classical Pillars (3 Right) -->
      <rect x="164" y="292" width="18" height="74" rx="4"/>
      <rect x="196" y="292" width="18" height="74" rx="4"/>
      <rect x="228" y="292" width="18" height="74" rx="4"/>
      <rect x="266" y="292" width="18" height="74" rx="4"/>
      <rect x="298" y="292" width="18" height="74" rx="4"/>
      <rect x="330" y="292" width="18" height="74" rx="4"/>

      <!-- Base Plinth -->
      <rect x="136" y="370" width="240" height="16" rx="3"/>

      <!-- 3 Tiered Steps -->
      <polygon points="122,390 390,390 382,404 130,404"/>
      <polygon points="110,408 402,408 392,424 120,424"/>
      <polygon points="96,428 416,428 404,446 108,446"/>
    </g>

    <!-- Drum Windows (Right Half Cutouts) -->
    <g fill="#ffffff" opacity="0.95">
      <rect x="264" y="244" width="8" height="16" rx="4"/>
      <rect x="284" y="244" width="8" height="16" rx="4"/>
      <rect x="304" y="244" width="8" height="16" rx="4"/>
      <rect x="324" y="244" width="8" height="16" rx="4"/>
    </g>

    <!-- Clean 2.4px Center Dividing Meridian -->
    <line x1="256" y1="110" x2="256" y2="446" stroke="#ffffff" stroke-width="2.4"/>
  </g>
</svg>
