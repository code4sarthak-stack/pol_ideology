<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="t4-needle-glow" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="65%" stop-color="#1e293b"/>
      <stop offset="90%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <radialGradient id="t4-halo" cx="50%" cy="10%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <filter id="t4-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="#ffffff"/>
  <rect width="512" height="512" rx="112" fill="none" stroke="#f1f5f9" stroke-width="2"/>

  <!-- Gauge & Meter Group -->
  <g transform="translate(256, 305)" filter="url(#t4-shadow)">
    <!-- Outer Arch Frame -->
    <path d="M -160,0 A 160 160 0 0 1 160,0" fill="none" stroke="#64748b" stroke-width="14" stroke-linecap="round" opacity="0.6"/>
    <path d="M -176,0 A 176 176 0 0 1 176,0" fill="none" stroke="#e2e8f0" stroke-width="3" stroke-linecap="round"/>
    <path d="M -144,0 A 144 144 0 0 1 144,0" fill="none" stroke="#1e293b" stroke-width="7" stroke-linecap="round"/>

    <!-- Calibrated Radial Tick Marks -->
    <!-- Major & Minor Ticks: Angle from -90 (left) to +90 (right) deg -->
    <!-- -90 deg -->
    <line x1="-138" y1="0" x2="-118" y2="0" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>
    <!-- -75 deg -->
    <line x1="-133" y1="-35" x2="-120" y2="-32" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- -60 deg -->
    <line x1="-120" y1="-69" x2="-105" y2="-60" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- -45 deg -->
    <line x1="-97" y1="-97" x2="-86" y2="-86" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- -30 deg -->
    <line x1="-69" y1="-120" x2="-60" y2="-105" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- -15 deg -->
    <line x1="-35" y1="-133" x2="-31" y2="-119" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    
    <!-- 0 deg (Top Center - Equilibrium) -->
    <line x1="0" y1="-138" x2="0" y2="-114" stroke="#f59e0b" stroke-width="5" stroke-linecap="round"/>

    <!-- +15 deg -->
    <line x1="35" y1="-133" x2="31" y2="-119" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- +30 deg -->
    <line x1="69" y1="-120" x2="60" y2="-105" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- +45 deg -->
    <line x1="97" y1="-97" x2="86" y2="-86" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- +60 deg -->
    <line x1="120" y1="-69" x2="105" y2="-60" stroke="#1e293b" stroke-width="4" stroke-linecap="round"/>
    <!-- +75 deg -->
    <line x1="133" y1="-35" x2="120" y2="-32" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
    <!-- +90 deg -->
    <line x1="138" y1="0" x2="118" y2="0" stroke="#1e293b" stroke-width="5" stroke-linecap="round"/>

    <!-- Subtle Golden Halo behind the needle tip -->
    <circle cx="0" cy="-125" r="28" fill="url(#t4-halo)"/>

    <!-- Center Magnetic Needle in Equilibrium -->
    <polygon points="-10,5 10,5 0,-136" fill="url(#t4-needle-glow)"/>

    <!-- Baseline Ground Anchor -->
    <line x1="-90" y1="5" x2="90" y2="5" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
    
    <!-- Central Pivot Pivot Disc -->
    <circle cx="0" cy="5" r="14" fill="#ffffff" stroke="#1e293b" stroke-width="4"/>
    <circle cx="0" cy="5" r="5" fill="#f59e0b"/>
  </g>
</svg>
